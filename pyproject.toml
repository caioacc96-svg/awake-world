[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E701", "E702", "E741"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
exclude = "^(build|dist|\\.venv)/"
