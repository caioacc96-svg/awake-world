name: Awake World 0.5 Source Bootstrap

on:
  push:
    branches:
      - feat/0.5-global
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/0.5-global
          fetch-depth: 0

      - name: Reconstruct verified source archive
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          parts = sorted(Path('.bootstrap/parts').glob('part_*.txt'))
          if len(parts) != 8:
              raise SystemExit(f'BOOTSTRAP_PART_COUNT_MISMATCH expected=8 actual={len(parts)}')
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          payload = base64.b64decode(encoded)
          digest = hashlib.sha256(payload).hexdigest()
          expected = '56d376aa38030f92198dfa81ee74ce067b9565cbc4914107ccbfd36361ef1e43'
          if digest != expected:
              raise SystemExit(f'BOOTSTRAP_SHA_MISMATCH expected={expected} actual={digest}')
          Path('/tmp/awake05.tar.gz').write_bytes(payload)
          print(f'AWAKE_BOOTSTRAP_VERIFIED bytes={len(payload)} sha256={digest}')
          PY

      - name: Expand Awake World 0.5 source
        shell: bash
        run: |
          tar -xzf /tmp/awake05.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          rm -f .github/workflows/ci.yml
          rm -f .github/workflows/release.yml
          rm -f .github/workflows/update-goldens.yml
          git status --short

      - name: Commit imported source
        shell: bash
        run: |
          git config user.name "awake-world-ci"
          git config user.email "awake-world-ci@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "AWAKE_BOOTSTRAP_NO_CHANGES"
            exit 0
          fi
          git commit -m "feat: import Awake World 0.5 GLOBAL source candidate"
          git push origin HEAD:feat/0.5-global
