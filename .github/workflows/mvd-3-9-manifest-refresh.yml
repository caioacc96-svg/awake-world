name: MVD 3-9 Manifest Refresh

on:
  push:
    branches: ['feat/0.6-mvd-3-to-9-completion']
    paths-ignore:
      - BUILD_MANIFEST.json

permissions:
  contents: write

concurrency:
  group: awake-06-mvd-manifest-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/0.6-mvd-3-to-9-completion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate canonical manifest
        run: python tools/build_manifest.py
      - name: Commit manifest if changed
        shell: bash
        run: |
          if git diff --quiet -- BUILD_MANIFEST.json; then
            echo "AWAKE_MANIFEST_ALREADY_CURRENT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_MANIFEST.json
          git commit -m "Build: refresh manifest for MVD 3-9"
          git push
