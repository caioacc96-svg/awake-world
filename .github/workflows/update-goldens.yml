name: Refresh Awake Canonical Manifest

on:
  push:
    branches: ['feat/0.5-global']
    paths:
      - '.github/workflows/update-goldens.yml'

permissions:
  contents: write

jobs:
  refresh-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate canonical manifest
        run: python tools/build_manifest.py
      - name: Commit canonical manifest
        run: |
          git config user.name "awake-world-ci"
          git config user.email "awake-world-ci@users.noreply.github.com"
          git add BUILD_MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate canonical cross-platform manifest"
            git push origin HEAD:feat/0.5-global
          fi
