name: Awake World 0.5 Source Import

on:
  push:
    branches: ['feat/0.5-global']
    paths: ['bootstrap/READY']

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct audited source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source.part*.b64 | base64 -d > /tmp/awake05-source.tar.gz
          echo "1b8769c0e075f05f9a520c940d435c13cec891d4125e98f60a6305e01c121427  /tmp/awake05-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/awake05-source.tar.gz
          rm -rf bootstrap .github/workflows/bootstrap-import.yml
      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "awake-world-ci"
          git config user.email "awake-world-ci@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Awake World 0.5 GLOBAL source candidate"
          git push origin HEAD:feat/0.5-global
