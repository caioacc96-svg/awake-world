name: Awake World 0.6 Release

on:
  push:
    branches:
      - 'release/0.6.*'
    tags:
      - 'v0.6.*'
  workflow_dispatch:

concurrency:
  group: awake-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  AWAKE_SAVE_DIR: ${{ github.workspace }}/.ci-save

jobs:
  prepare:
    name: PREPARE CANONICAL RELEASE SOURCE
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      release_tag: ${{ steps.source.outputs.tag }}
      artifact_stem: ${{ steps.source.outputs.stem }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonicalize version + manifest
        id: source
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ -z "$version" || "$version" == *-dev* ]]; then
            echo "RELEASE_VERSION_NOT_FINAL: $version"
            exit 1
          fi
          if [[ ! "$version" =~ ^0\.6\.[0-9]+$ ]]; then
            echo "RELEASE_VERSION_NOT_0_6: $version"
            exit 1
          fi

          python tools/build_manifest.py
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            git config user.name "awake-world-ci"
            git config user.email "awake-world-ci@users.noreply.github.com"
            git add BUILD_MANIFEST.json
            if ! git diff --cached --quiet; then
              git commit -m "build: canonicalize manifest for v$version"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          else
            python tools/build_manifest.py --check
          fi

          source_sha="$(git rev-parse HEAD)"
          clean_version="${version//./_}"
          stem="AwakeWorld_${clean_version}_GLOBAL_Windows"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "stem=$stem" >> "$GITHUB_OUTPUT"
          echo "AWAKE_RELEASE_SOURCE=$source_sha"
          echo "AWAKE_RELEASE_TAG=v$version"
          echo "AWAKE_RELEASE_ARTIFACT=$stem"

  validate:
    name: RELEASE QUALITY GATES
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python tools/generate_audio_assets.py --force
      - run: python -m compileall -q awake_world tools tests
      - run: python tools/static_validate.py
      - run: python tools/build_manifest.py --check
      - run: python -m ruff check --select F awake_world/simulation awake_world/presentation awake_world/world/systems awake_world/world/save.py tests tools
      - run: python -m mypy awake_world/simulation awake_world/presentation awake_world/world/save.py
      - run: python -m pytest -q tests
      - run: python tools/core_test.py
      - run: python tools/deterministic_replay_test.py
      - run: python tools/gameplay_tests.py
      - run: python tools/mvd_3_to_9_gate.py

  windows-release:
    name: WINDOWS RELEASE · QT · VISUAL · PACKAGE · SMOKE
    needs: [prepare, validate]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt
      - run: python tools/generate_audio_assets.py --force
      - name: Qt offscreen smoke
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          $env:QT_LOGGING_RULES='qt.multimedia.*=false'
          python tools/smoke_test.py
      - name: Visual regression
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          $env:QT_LOGGING_RULES='qt.multimedia.*=false'
          python tools/render_golden_scenes.py --output visual_output
      - name: Write release build metadata
        env:
          GITHUB_SHA: ${{ needs.prepare.outputs.source_sha }}
          GITHUB_REF_NAME: ${{ needs.prepare.outputs.release_tag }}
        run: python tools/write_build_metadata.py
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean awake_world.spec
      - name: Packaged smoke
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          $env:QT_LOGGING_RULES='qt.multimedia.*=false'
          $p = Start-Process -FilePath '.\dist\AWAKE_WORLD.exe' -ArgumentList '--smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Packaged smoke failed with exit code $($p.ExitCode)" }
      - name: Package + checksums
        shell: pwsh
        env:
          ARTIFACT_STEM: ${{ needs.prepare.outputs.artifact_stem }}
        run: |
          python tools/package_windows.py
          $zip = ".\release\$env:ARTIFACT_STEM.zip"
          if (-not (Test-Path $zip)) { throw "Release package missing: $zip" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ARTIFACT_STEM.zip" | Set-Content -NoNewline ".\release\$env:ARTIFACT_STEM.zip.sha256"
      - name: Upload visual review artifact
        uses: actions/upload-artifact@v4
        with:
          name: awake-06-release-visual-output
          path: visual_output
          if-no-files-found: error
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_stem }}
          path: |
            release/${{ needs.prepare.outputs.artifact_stem }}.zip
            release/${{ needs.prepare.outputs.artifact_stem }}.zip.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          ARTIFACT_STEM: ${{ needs.prepare.outputs.artifact_stem }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:RELEASE_TAG already exists; refusing to overwrite a published release."
          }
          gh release create $env:RELEASE_TAG ".\release\$env:ARTIFACT_STEM.zip" ".\release\$env:ARTIFACT_STEM.zip.sha256" --repo $env:GITHUB_REPOSITORY --target $env:SOURCE_SHA --title "Awake World 0.6.0 — THE LIVING QUARTER" --notes-file CHANGELOG.md
